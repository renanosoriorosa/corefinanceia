# Configuracao como codigo: o datasource nasce provisionado, entao sobrevive a
# `docker compose down` sem ninguem reconfigurar nada pela UI.
# Tempo entra aqui na fase 05; os derivedFields do Loki, na fase 06.
apiVersion: 1

datasources:
  - name: Loki
    type: loki
    uid: loki
    access: proxy
    url: http://loki:3100
    isDefault: true

  - name: Prometheus
    type: prometheus
    uid: prometheus
    access: proxy
    url: http://prometheus:9090
    jsonData:
      # Precisa ser >= scrape_interval do prometheus.yml. Menor que isso faz o Grafana pedir
      # mais pontos do que existem e o grafico aparece serrilhado.
      timeInterval: 15s
