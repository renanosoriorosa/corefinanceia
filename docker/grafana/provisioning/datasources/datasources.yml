# Configuracao como codigo: o datasource nasce provisionado, entao sobrevive a
# `docker compose down` sem ninguem reconfigurar nada pela UI.
# Prometheus e Tempo entram aqui nas fases 04 e 05; os derivedFields do Loki, na fase 06.
apiVersion: 1

datasources:
  - name: Loki
    type: loki
    uid: loki
    access: proxy
    url: http://loki:3100
    isDefault: true
