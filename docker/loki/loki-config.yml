# Loki 3.x — configuracao minima de laboratorio: tudo em disco local, sem anel distribuido.
# ATENCAO: o 3.x so aceita schema v13 + store tsdb. Tutorial com boltdb-shipper/v11 nao sobe.
auth_enabled: false

server:
  http_listen_port: 3100

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2024-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  retention_period: 168h        # 7 dias, suficiente para um lab
  allow_structured_metadata: true
  # O Loki 3.x, por conta propria, deriva um label service_name a partir de app/service/... e
  # um detected_level a partir do conteudo. Aqui os dois seriam copias de labels que a aplicacao
  # ja envia de proposito — e a regra do lab e: quem decide o label e quem gera o log.
  discover_service_name: []
  discover_log_levels: false
