services:
  api:
    build:
      context: ./src
      dockerfile: Dockerfile
    container_name: corefinance-api
    ports:
      - "5176:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: "user=sa;pwd=SQLServerDocker@;Data Source=host.docker.internal,1433;Initial Catalog=CoreFinance;MultipleActiveResultSets=True;Application Name=EF-CORE;TrustServerCertificate=True;"
      Jwt__Key: "corefinance-chave-de-desenvolvimento-com-mais-de-32-caracteres"
      Jwt__Issuer: "CoreFinance"
      Jwt__Audience: "CoreFinance"
      Jwt__ExpiraEmMinutos: "480"
      Observability__Demo__Enabled: "true"
      # Indice 1 = o sink GrafanaLoki no array Serilog:WriteTo do appsettings.json.
      # No host o Loki e localhost:3100; aqui dentro da rede do compose e o hostname do servico.
      # Se um sink for inserido antes dele no appsettings, este indice precisa mudar junto.
      Serilog__WriteTo__1__Args__uri: "http://loki:3100"
      # Sinais OTLP (metricas na fase 04, traces na 05) vao para o Collector, nunca direto
      # para o backend. Com o profile "obs" desligado o Collector nao existe e o SDK apenas
      # loga falha de exportacao em backoff — a API continua respondendo. Para calar de vez:
      # Observability__Enabled: "false".
      OTEL_SERVICE_NAME: corefinance-api
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      OTEL_EXPORTER_OTLP_PROTOCOL: grpc
      OTEL_RESOURCE_ATTRIBUTES: service.namespace=corefinance,deployment.environment=local
      # Padrao do SDK e 60s. Alinhado ao scrape_interval do Prometheus, o que voce acabou de
      # provocar aparece no grafico em ~15s em vez de "sumir" por um minuto — a diferenca entre
      # o lab ensinar e o lab frustrar. Em producao, 60s economiza CPU e rede.
      OTEL_METRIC_EXPORT_INTERVAL: "15000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: corefinance-web
    ports:
      - "3000:3000"
    environment:
      API_URL: http://api:8080
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  # --- Stack de observabilidade (profile "obs") -------------------------------
  # `docker compose up -d`                  -> so api + web, como sempre foi.
  # `docker compose --profile obs up -d`    -> sobe tambem o laboratorio.

  loki:
    image: grafana/loki:3.4.2
    container_name: corefinance-loki
    profiles: ["obs"]
    command: -config.file=/etc/loki/loki-config.yml
    ports:
      - "3100:3100"
    volumes:
      - ./docker/loki/loki-config.yml:/etc/loki/loki-config.yml:ro
      - loki-data:/loki
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.6.1
    container_name: corefinance-grafana
    profiles: ["obs"]
    ports:
      - "3001:3000"          # 3000 no host ja e do web
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      # Sem isto o Viewer nao recebe a permissao datasources:explore e o menu Explore some da
      # navegacao — ou seja, quem entra sem logar nao tem onde consultar log nenhum, que e a
      # unica coisa que o lab faz nesta fase.
      GF_USERS_VIEWERS_CAN_EDIT: "true"
      GF_USERS_DEFAULT_THEME: dark
    volumes:
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./docker/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - loki
      - prometheus
    restart: unless-stopped

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.121.0
    container_name: corefinance-otel-collector
    profiles: ["obs"]
    command: ["--config=/etc/otelcol/config.yml"]
    volumes:
      - ./docker/otel-collector/otel-collector-config.yml:/etc/otelcol/config.yml:ro
    ports:
      # 4317/4318 ficam publicados pelo mesmo motivo do 3100 do Loki: rodando a API pelo
      # Visual Studio (fora do compose) ela precisa alcancar o Collector pelo localhost.
      - "4317:4317"        # OTLP gRPC
      - "4318:4318"        # OTLP HTTP
      - "8889:8889"        # /metrics, para depuracao com curl
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.2.1
    container_name: corefinance-prometheus
    profiles: ["obs"]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=7d
      - --web.enable-lifecycle
    ports:
      - "9090:9090"
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    depends_on:
      - otel-collector
    restart: unless-stopped

volumes:
  loki-data:
  grafana-data:
  prometheus-data:
